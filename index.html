<!DOCTYPE html>
<html>
    <body>
        <p> Enter a number & click the number </p>
        <input id="id1" type="number" min="50"
        max="100" required>

        <button onclick="myFunction()"> Click me</button>
        <p> Please Write number more than 50 and less than 100.</p>
        <p id="result"></p>
        <script>
            function myFunction() {
                var inpObj = document.getElementById("id1");
                if (! inObj.checkValidity()) {
                    document.getElementById("result").innerHTML = inpObj.validationMessage;
                } else {
                    document.getElementById("result").
                    innerHTML = "You can do the transaction";
                }
            }
        </script>
    </body>
</html>
